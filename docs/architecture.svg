<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">InsightPilot AI architecture</title>
  <desc id="desc">A flow diagram showing a Streamlit interface, data upload and Pandas processing, query routing to deterministic analytics or local Ollama and Qwen, business insights and recommendations, and Excel and PDF reports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1b2434"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" x2="1">
      <stop offset="0" stop-color="#b45309"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <style>
      .heading{font:700 30px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .sub{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .boxTitle{font:700 20px Inter,Segoe UI,Arial,sans-serif;fill:#fff}
      .boxText{font:400 14px Inter,Segoe UI,Arial,sans-serif;fill:#e2e8f0}
      .note{font:600 13px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .line{fill:none;stroke:#94a3b8;stroke-width:2.5;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#a78bfa;stroke-width:2.2;stroke-dasharray:7 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="760" rx="26" fill="url(#bg)"/>
  <text x="600" y="58" text-anchor="middle" class="heading">InsightPilot AI — System Architecture</text>
  <text x="600" y="87" text-anchor="middle" class="sub">Local-first analytics workflow with deterministic calculations and an LLM fallback</text>

  <!-- User and UI -->
  <rect x="435" y="120" width="330" height="86" rx="16" fill="url(#blue)" stroke="#93c5fd" stroke-opacity=".4"/>
  <text x="600" y="154" text-anchor="middle" class="boxTitle">User</text>
  <text x="600" y="180" text-anchor="middle" class="boxText">Uploads data · explores · asks questions</text>

  <path d="M600 206 V238" class="line"/>
  <rect x="390" y="242" width="420" height="88" rx="16" fill="#253247" stroke="#64748b" stroke-width="1.5"/>
  <text x="600" y="276" text-anchor="middle" class="boxTitle">Streamlit Interface</text>
  <text x="600" y="302" text-anchor="middle" class="boxText">Overview · Explore Data · AI Analyst · Reports</text>

  <!-- Ingestion -->
  <path d="M600 330 V358" class="line"/>
  <rect x="390" y="362" width="420" height="78" rx="16" fill="url(#teal)" stroke="#5eead4" stroke-opacity=".5"/>
  <text x="600" y="394" text-anchor="middle" class="boxTitle">CSV / Excel Upload</text>
  <text x="600" y="418" text-anchor="middle" class="boxText">Pandas DataFrame · validation · profiling</text>

  <!-- Branch line -->
  <path d="M600 440 V466 H290 V488" class="line"/>
  <path d="M600 466 H910 V488" class="line"/>

  <!-- Analytics path -->
  <rect x="75" y="492" width="430" height="116" rx="16" fill="#164e63" stroke="#67e8f9" stroke-opacity=".5"/>
  <text x="290" y="526" text-anchor="middle" class="boxTitle">Pandas Analytics Engine</text>
  <text x="290" y="552" text-anchor="middle" class="boxText">Totals · averages · rankings · monthly trends</text>
  <text x="290" y="576" text-anchor="middle" class="boxText">Exact calculations from the active dataset</text>

  <!-- LLM path -->
  <rect x="695" y="492" width="430" height="116" rx="16" fill="url(#purple)" stroke="#c4b5fd" stroke-opacity=".6"/>
  <text x="910" y="526" text-anchor="middle" class="boxTitle">Local LLM Fallback</text>
  <text x="910" y="552" text-anchor="middle" class="boxText">Query not recognised by the router</text>
  <text x="910" y="576" text-anchor="middle" class="boxText">Ollama · Qwen 2.5 1.5B</text>

  <!-- Result combination -->
  <path d="M290 608 V637 H600" class="line"/>
  <path d="M910 608 V637 H600" class="line"/>
  <path d="M600 637 V652" class="line"/>
  <rect x="390" y="656" width="420" height="78" rx="16" fill="#334155" stroke="#cbd5e1" stroke-opacity=".5"/>
  <text x="600" y="687" text-anchor="middle" class="boxTitle">Answers & Visual Results</text>
  <text x="600" y="711" text-anchor="middle" class="boxText">Explanation · result table · interactive chart</text>

  <!-- side output modules -->
  <rect x="55" y="240" width="265" height="190" rx="16" fill="#253247" stroke="#64748b" stroke-width="1.3"/>
  <text x="187" y="278" text-anchor="middle" class="boxTitle">Insight Layer</text>
  <text x="187" y="312" text-anchor="middle" class="boxText">Automatic business insights</text>
  <text x="187" y="338" text-anchor="middle" class="boxText">IQR outlier flags</text>
  <text x="187" y="364" text-anchor="middle" class="boxText">Rule-based recommendations</text>
  <text x="187" y="398" text-anchor="middle" class="note">Reads the active DataFrame</text>
  <path d="M390 401 H322" class="dash"/>

  <rect x="880" y="240" width="265" height="190" rx="16" fill="#3b2b1f" stroke="#fb923c" stroke-opacity=".65" stroke-width="1.3"/>
  <text x="1012" y="278" text-anchor="middle" class="boxTitle">Report Generator</text>
  <text x="1012" y="312" text-anchor="middle" class="boxText">Excel workbook (.xlsx)</text>
  <text x="1012" y="338" text-anchor="middle" class="boxText">PDF business report</text>
  <text x="1012" y="364" text-anchor="middle" class="boxText">CSV dataset export</text>
  <text x="1012" y="398" text-anchor="middle" class="note">Uses metrics, insights & recommendations</text>
  <path d="M810 401 H880" class="dash"/>
</svg>